<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>가격 검산 엔진</title>
<style>
@font-face{font-family:Jua;src:url(fonts/Jua-Regular.ttf),local('Noto Sans CJK KR Bold')}
@font-face{font-family:Pre;font-weight:500;src:url(fonts/Pretendard-Medium.woff2)}
@font-face{font-family:Pre;font-weight:600;src:url(fonts/Pretendard-SemiBold.woff2)}
@font-face{font-family:Pre;font-weight:700;src:url(fonts/Pretendard-Bold.woff2)}
@font-face{font-family:Pre;font-weight:800;src:url(fonts/Pretendard-ExtraBold.woff2)}
:root{--paper:#FFF6EC;--ink:#3E2F25;--sub:#8A776A;--soft:#B07A55;--card:#FFFFFF;
  --local:#E0533D;--same:#8C8F96;--korea:#2F6FDB;--only:#8E5BD6;--yellow:#FFE27A;--mint:#8FD3C1;
  --round:Jua,Pre,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:Pre,sans-serif;color:var(--ink)}
.abs{position:absolute}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
#paperTex{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}
#hdr{left:60px;top:214px;width:840px}
#hdr .lab{font-family:var(--round);font-size:34px;color:var(--soft);letter-spacing:-.5px;white-space:nowrap}
#hdr .ttl{font-family:var(--round);font-size:58px;line-height:1.15;margin-top:2px;letter-spacing:-1px;white-space:nowrap}
#topchips{left:60px;top:160px;display:flex;gap:10px;align-items:center}
.tchip{height:44px;padding:0 16px;border-radius:22px;font-weight:700;font-size:24px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tchip b{border-radius:8px;padding:2px 9px;font-size:21px;color:#fff}
.tchip.ad{background:#FFE1D3;color:#A23F25}.tchip.ad b{background:#A23F25}
.tchip.ai{background:#E4EEF9;color:#3B5B85}.tchip.ai b{background:#3B5B85}
.tchip.tm{background:#EFE8DD;color:#6B5A4D}.tchip.tm b{background:#8A776A}
.tchip.wmc{background:#D33B3B;color:#fff}
#disc{left:60px;top:340px;width:840px;padding:26px 30px;border-radius:30px;background:#FFF0E8;border:3px solid #F2B39C;
  font-size:34px;font-weight:700;color:#8E361F;line-height:1.45;word-break:keep-all}
#disc b{display:inline-block;background:#A23F25;color:#fff;border-radius:10px;padding:0 12px;margin-right:10px}
#wm{left:520px;top:160px;height:44px;padding:0 16px;border-radius:12px;background:#D33B3B;color:#fff;font-weight:800;font-size:22px;
  display:flex;align-items:center;white-space:nowrap}
#wmBig{left:-200px;top:820px;width:1480px;text-align:center;transform:rotate(-24deg);font-family:var(--round);font-size:110px;color:rgba(211,59,59,.10);white-space:nowrap}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
.card{position:absolute;background:var(--card);border-radius:40px;box-shadow:0 14px 36px rgba(120,80,40,.12),0 2px 6px rgba(120,80,40,.06)}
/* 영수증(사진 또는 도리의 검산 영수증) */
.rcpt{left:150px;top:350px;width:640px;height:820px;border-radius:14px 14px 0 0;overflow:hidden;background:#FFFEFB;
  box-shadow:0 14px 36px rgba(120,80,40,.14);font-family:Pre;padding:44px 50px 0}
.rcpt .zig{position:absolute;left:0;right:0;bottom:-1px;height:26px;background:
  linear-gradient(135deg,var(--paper) 25%,transparent 25%) -13px 0/26px 26px,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -13px 0/26px 26px}
.rcpt .st{font-family:var(--round);font-size:46px;text-align:center}
.rcpt .dt{font-size:25px;color:var(--sub);text-align:center;margin-top:8px;font-weight:600}
.rcpt .hr{border-top:4px dashed #E2D7CA;margin:22px 0}
.rcpt .ln{display:flex;justify-content:space-between;gap:16px;font-size:31px;font-weight:600;line-height:1.85;color:#4A3B30}
.rcpt .ln span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcpt .ln .tf{font-size:21px;font-weight:700;color:#B3542F;border:2px solid #E7A98E;border-radius:6px;padding:0 6px;margin-left:8px;vertical-align:4px}
.rcpt .tot{display:flex;justify-content:space-between;font-size:40px;font-weight:800;margin-top:4px}
.rcpt .krw{display:flex;justify-content:space-between;font-size:30px;font-weight:700;color:var(--sub);margin-top:10px}
.rcpt .note{position:absolute;left:50px;right:50px;bottom:44px;font-size:22px;color:#A89786;font-weight:600;line-height:1.5}
.rphoto{left:150px;top:350px;width:640px;height:820px;border-radius:24px;overflow:hidden;background:#F3EEE7;box-shadow:0 14px 36px rgba(120,80,40,.14)}
.blurbox{position:absolute;backdrop-filter:blur(18px);background:rgba(232,226,218,.92);border-radius:8px}
.qsticker{left:300px;top:930px;width:540px;padding:26px 30px;background:var(--yellow);border-radius:26px;font-family:var(--round);font-size:58px;
  line-height:1.25;text-align:center;box-shadow:0 10px 24px rgba(140,100,20,.18);word-break:keep-all}
.qsticker.one{width:auto;left:260px;padding:18px 34px;font-size:50px;white-space:nowrap}
.rcpt.auto{height:auto;padding-bottom:30px}
.rcpt.auto .ln{line-height:1.62}
.rcpt.auto .dt{white-space:nowrap}
.rcpt.auto .note{position:static;margin-top:18px}
.rcpt.auto .zig{bottom:-1px}
.kicker{left:96px;top:330px;padding:12px 24px;background:#E0533D;color:#fff;border-radius:16px;font-family:var(--round);font-size:36px;
  box-shadow:0 8px 18px rgba(160,60,30,.22);white-space:nowrap;z-index:3}
/* 품목 */
.ititle{left:60px;top:352px;width:840px;display:flex;align-items:center;gap:20px}
.sticker{display:inline-block;background:var(--yellow);font-family:var(--round);font-size:38px;padding:8px 22px;border-radius:16px;
  box-shadow:0 6px 14px rgba(140,100,20,.16);white-space:nowrap;flex:none}
.sticker.tw{background:#FFD3C7}.sticker.rg{background:#D9E3F7}
.iname{font-family:var(--round);font-size:54px;letter-spacing:-1px;white-space:nowrap}
.media{left:60px;top:440px;width:840px;height:372px;border-radius:36px;overflow:hidden;background:#EFE6DA}
.media img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media .illu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mchip{position:absolute;left:22px;bottom:20px;background:rgba(255,255,255,.92);border-radius:16px;padding:6px 16px;font-size:23px;font-weight:700;color:#6B5A4D}
.code{position:absolute;right:22px;top:20px;background:rgba(255,255,255,.92);border-radius:16px;padding:6px 14px;font-size:21px;font-weight:700;color:#8A776A}
.calc{left:60px;top:834px;width:840px;height:326px;padding:12px 36px}
.row{display:flex;align-items:center;justify-content:space-between;height:75px;border-bottom:2px dashed #EEE4D8}
.row:last-child{border-bottom:0}
.row .lab{font-size:29px;font-weight:700;color:var(--sub);white-space:nowrap}
.row .lab small{display:block;font-size:21px;font-weight:600;color:#AA9888;margin-top:1px}
.row .val{font-size:44px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
.row.diff .val{font-size:46px}
.pctchip{display:inline-block;font-size:30px;font-weight:800;color:#fff;border-radius:12px;padding:3px 12px;margin-left:12px;vertical-align:6px}
.stamp{right:196px;top:628px;min-width:300px;height:150px;padding:0 30px;display:flex;align-items:center;justify-content:center;border-radius:26px;transform-origin:85% 50%;
  border:9px solid currentColor;font-family:var(--round);font-size:58px;letter-spacing:-1px;background:rgba(255,255,255,.80);filter:url(#ink);white-space:nowrap}
.mark{left:0;top:0;width:1080px;height:1920px;pointer-events:none}
/* 알아 둘 점 */
.ntitle{left:60px;top:352px;width:840px;display:flex;align-items:center;gap:20px}
.ntitle .t{font-family:var(--round);font-size:50px;letter-spacing:-1px;white-space:nowrap}
.ncard{left:60px;top:450px;width:840px;padding:30px 40px 26px}
.nrow{display:flex;gap:22px;align-items:flex-start;padding:18px 0;border-bottom:2px dashed #EEE4D8}
.nrow:last-of-type{border-bottom:0}
.nrow .no{flex:none;width:58px;height:58px;border-radius:50%;background:#FFE9DD;color:#C4502F;font-family:var(--round);font-size:34px;display:flex;align-items:center;justify-content:center}
.nrow .tx{font-size:36px;font-weight:700;line-height:1.38;word-break:keep-all;color:var(--ink)}
.nrow .tx small{display:block;font-size:24px;font-weight:600;color:#9C8B7C;margin-top:6px}
.nsrc{font-size:22px;font-weight:600;color:#A89786;margin-top:16px}
/* 합계 */
.stitle{left:60px;top:352px;font-family:var(--round);font-size:56px}
.sum{left:60px;top:436px;width:840px;padding:30px 40px 28px}
.bar{margin-bottom:24px}
.bar .bl{display:flex;justify-content:space-between;font-size:30px;font-weight:700;color:var(--sub)}
.bar .bl b{font-size:40px;color:var(--ink);font-weight:800}
.bar .tr{height:44px;border-radius:22px;background:#F3ECE3;margin-top:10px;overflow:hidden}
.bar .fill{height:100%;border-radius:22px}
.res{font-family:var(--round);font-size:70px;margin-top:4px;letter-spacing:-1px;white-space:nowrap}
.res small{font-family:Pre;font-size:30px;font-weight:700;color:var(--sub);margin-left:12px;letter-spacing:0}
.refund{margin-top:12px;font-size:27px;font-weight:700;color:#3B7F6A;background:#E6F4EE;border-radius:16px;padding:10px 18px;word-break:keep-all}
.chips{left:60px;width:840px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:9px 16px 9px 20px;font-size:25px;font-weight:700;
  box-shadow:0 6px 16px rgba(120,80,40,.08)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip i{font-style:normal;font-family:var(--round);font-size:24px;border:3px solid currentColor;border-radius:10px;padding:0 8px;white-space:nowrap;flex:none}
.snote{grid-column:1 / -1;font-size:22px;font-weight:600;color:#9C8B7C;margin-top:4px;word-break:keep-all;line-height:1.5}
/* 마무리 */
.ask{left:60px;top:370px;width:840px;font-family:var(--round);font-size:74px;line-height:1.25;letter-spacing:-1px;word-break:keep-all}
.ask small{display:block;font-size:46px;color:var(--soft);margin-top:12px}
.src{left:60px;top:640px;width:840px;padding:28px 36px;font-size:24px;font-weight:600;line-height:1.7;color:#6B5A4D;word-break:keep-all}
.src b{color:var(--ink);font-weight:800;margin-right:6px}
.src .t{font-family:var(--round);font-size:34px;color:var(--ink);margin-bottom:6px}
/* 말풍선 */
#bubble{left:404px;top:1226px;width:500px;min-height:150px;background:#fff;border-radius:40px;padding:26px 34px;
  box-shadow:0 12px 30px rgba(120,80,40,.13);display:flex;align-items:center}
#bubble:before{content:"";position:absolute;left:-26px;top:70px;border:16px solid transparent;border-right:30px solid #fff;border-left:0}
#btext{font-family:var(--round);font-size:41px;line-height:1.38;letter-spacing:-.5px;word-break:keep-all;color:var(--ink)}
#dori{left:26px;top:1150px;width:372px;height:400px}
#preload,#preload2{position:absolute;left:0;top:-4000px;width:1000px;opacity:0;font-family:var(--round)}
#preload2{top:-3000px;font-family:Pre;font-weight:800}
</style>
<script src="data.js"></script>
<script src="dori.js"></script>
</head><body>
<div id="stage">
  <div id="bg" class="abs" style="inset:0">
    <div class="blob" id="b1" style="width:760px;height:760px;background:radial-gradient(circle,#FFD9C2,transparent 70%)"></div>
    <div class="blob" id="b2" style="width:700px;height:700px;background:radial-gradient(circle,#D8EEDF,transparent 70%)"></div>
    <div class="blob" id="b3" style="width:640px;height:640px;background:radial-gradient(circle,#FFEDB0,transparent 70%)"></div>
    <svg id="paperTex" width="1080" height="1920"><filter id="pn"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .22 0"/></filter><rect width="100%" height="100%" filter="url(#pn)"/></svg>
  </div>
  <svg width="0" height="0" style="position:absolute"><filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter></svg>

  <div id="topchips" class="abs"></div>
  <div id="wm" class="abs">예시 데이터 · 실제 가격 아님</div>
  <div id="dori" class="abs"></div>
  <div id="bubble" class="abs"><div id="btext"></div></div>
  <div id="preload"></div><div id="preload2"></div>
</div>
<script>
// ---- 데이터: render.py 가 window.DATA = {episode, facts, timeline, media, notes} 를 넣는다 ----
const D = window.DATA, F = D.facts, T = D.timeline, E = D.episode;
const WEB = (F.mode || E.mode || 'web') === 'web';
const $ = (s, el = document) => el.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - clamp(k), 3);
const eIn = k => Math.pow(clamp(k), 2);
const eBack = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const rise = (t, t0, d = .35) => clamp((t - t0) / d);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const VCOL = { local: 'var(--local)', same: 'var(--same)', korea: 'var(--korea)', only: 'var(--only)' };
const VHEX = { local: '#E0533D', same: '#8C8F96', korea: '#2F6FDB', only: '#8E5BD6' };
const items = Object.fromEntries(F.items.map(f => [f.id, f]));
const epItems = Object.fromEntries(E.items.map(i => [i.id, i]));
const PLACE = E.place || '현지';
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const md = d => { const m = String(d || '').match(/^(\d{4})-?(\d{2})-?(\d{2})/); return m ? `${+m[2]}/${+m[3]}` : String(d || ''); };
function fit(el, maxW, minPx) { // 한 줄 글자가 넘치면 글자 크기를 줄인다
  let px = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > maxW && px > minPx) { px -= 2; el.style.fontSize = px + 'px'; }
}

// ---- 상품 그림(일반 아이콘 — 브랜드 로고·실제 포장을 그리지 않는다) ----
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k); return `rgb(${Math.min(255, r)},${Math.min(255, g)},${Math.min(255, b)})`; }
const IC = {
  tee: c => `<path d="M95,72 l45,-24 q20,22 40,0 l45,24 l42,52 l-38,26 l-16,-20 v130 h-106 v-130 l-16,20 l-38,-26z" fill="${c}" stroke="${shade(c, .75)}" stroke-width="7" stroke-linejoin="round"/><path d="M140,48 q20,26 40,0" fill="none" stroke="${shade(c, .75)}" stroke-width="7"/>`,
  longtee: c => `<path d="M100,70 l40,-22 q20,22 40,0 l40,22 l26,60 l16,96 l-34,6 l-18,-90 v118 h-100 v-118 l-18,90 l-34,-6 l16,-96z" fill="${c}" stroke="${shade(c, .75)}" stroke-width="7" stroke-linejoin="round"/><path d="M140,48 q20,26 40,0" fill="none" stroke="${shade(c, .75)}" stroke-width="7"/>`,
  down: c => `<path d="M100,66 l30,-20 h60 l30,20 l28,54 l12,110 l-34,6 l-14,-96 v124 h-104 v-124 l-14,96 l-34,-6 l12,-110z" fill="${c}" stroke="${shade(c, .7)}" stroke-width="7" stroke-linejoin="round"/><g stroke="${shade(c, .72)}" stroke-width="5" fill="none"><path d="M110,110 h100"/><path d="M110,150 h100"/><path d="M110,190 h100"/><path d="M110,230 h100"/></g><path d="M160,48 v222" stroke="${shade(c, .55)}" stroke-width="5"/><rect x="130" y="40" width="60" height="22" rx="10" fill="${shade(c, .85)}"/>`,
  fleece: c => `<path d="M102,70 l28,-22 h60 l28,22 l26,58 l12,104 l-34,6 l-14,-92 v124 h-104 v-124 l-14,92 l-34,-6 l12,-104z" fill="${c}" stroke="${shade(c, .72)}" stroke-width="7" stroke-linejoin="round"/><path d="M160,50 v220" stroke="${shade(c, .5)}" stroke-width="6"/><circle cx="160" cy="70" r="7" fill="${shade(c, .5)}"/><g fill="${shade(c, .86)}">${[...Array(18)].map((_, i) => `<circle cx="${120 + (i % 6) * 15 + (i % 6 >= 3 ? 34 : 0)}" cy="${112 + Math.floor(i / 6) * 50}" r="4"/>`).join('')}</g>`,
  bag: c => `<path d="M70,60 q90,-70 180,0" fill="none" stroke="${shade(c, .7)}" stroke-width="10"/><path d="M80,130 q0,-55 80,-55 q80,0 80,55 v40 q0,70 -80,70 q-80,0 -80,-70z" fill="${c}" stroke="${shade(c, .72)}" stroke-width="7"/><path d="M84,150 q76,30 152,0" fill="none" stroke="${shade(c, .6)}" stroke-width="5"/><rect x="146" y="150" width="28" height="18" rx="5" fill="${shade(c, .6)}"/>`,
  backpack: c => `<rect x="90" y="60" width="140" height="190" rx="40" fill="${c}" stroke="${shade(c, .72)}" stroke-width="7"/><rect x="112" y="150" width="96" height="70" rx="18" fill="${shade(c, .88)}" stroke="${shade(c, .72)}" stroke-width="5"/><path d="M130,62 q30,-40 60,0" fill="none" stroke="${shade(c, .7)}" stroke-width="8"/>`,
  pants: c => `<path d="M110,50 h100 l14,210 h-48 l-16,-150 l-16,150 h-48z" fill="${c}" stroke="${shade(c, .72)}" stroke-width="7" stroke-linejoin="round"/><path d="M110,72 h100" stroke="${shade(c, .7)}" stroke-width="5"/>`,
  socks: c => `<path d="M110,50 h52 v120 l40,40 q14,22 -8,34 q-14,8 -30,-4 l-54,-50z" fill="${c}" stroke="${shade(c, .72)}" stroke-width="7" stroke-linejoin="round"/><path d="M110,70 h52" stroke="${shade(c, .7)}" stroke-width="6"/><path d="M168,50 h52 v120 l40,40 q14,22 -8,34 q-14,8 -30,-4 l-54,-50z" fill="${shade(c, 1.1)}" stroke="${shade(c, .72)}" stroke-width="7" stroke-linejoin="round" transform="translate(-10,8)"/>`,
  cap: c => `<path d="M80,170 q0,-100 90,-100 q90,0 90,100z" fill="${c}" stroke="${shade(c, .72)}" stroke-width="7"/><path d="M170,170 h110 q10,22 -20,26 h-90z" fill="${shade(c, .85)}" stroke="${shade(c, .72)}" stroke-width="7"/><circle cx="170" cy="72" r="8" fill="${shade(c, .7)}"/>`,
  shoe: c => `<path d="M60,200 q0,-60 40,-90 l40,10 q20,40 70,50 q60,10 60,50 v10 h-210z" fill="${c}" stroke="${shade(c, .72)}" stroke-width="7" stroke-linejoin="round"/><rect x="60" y="216" width="214" height="22" rx="10" fill="#fff" stroke="${shade(c, .72)}" stroke-width="6"/>`,
