<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도리 썸네일</title>
<link rel="stylesheet" href="jua/index.css">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.otf);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.otf);font-weight:900}
:root{--cream:#FFF6EC;--ink:#3E2F25;--mint:#2E9C83;--red:#E2483A;--yel:#FFD45C}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);font-family:P,sans-serif;color:var(--ink);word-break:keep-all}
.frame{position:relative;overflow:hidden;background:var(--cream)}
.abs{position:absolute}
.J{font-family:Jua;font-weight:400}
.blob{position:absolute;border-radius:50%}
.title{isolation:isolate;font-family:Jua;line-height:1.08;letter-spacing:-2px;color:var(--ink)}
.hl{position:relative;display:inline-block}
.hl:before{content:"";position:absolute;left:-10px;right:-10px;bottom:6%;height:34%;background:var(--yel);border-radius:14px;z-index:-1;transform:rotate(-1.5deg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gBox" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6CF9A"/><stop offset=".55" stop-color="#E2A869"/><stop offset="1" stop-color="#B97A40"/></linearGradient>
  <linearGradient id="gBoxTop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBDDB0"/><stop offset="1" stop-color="#E5B47A"/></linearGradient>
  <radialGradient id="gSh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5A3A28" stop-opacity=".34"/><stop offset="1" stop-color="#5A3A28" stop-opacity="0"/></radialGradient>
  <linearGradient id="gFront" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3C489"/><stop offset=".6" stop-color="#E3A964"/><stop offset="1" stop-color="#D0914F"/></linearGradient>
  <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C98A4E"/><stop offset="1" stop-color="#B07338"/></linearGradient>
  <linearGradient id="gTop" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F9D7A5"/><stop offset="1" stop-color="#EBBB80"/></linearGradient>
  <radialGradient id="gSh2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5A3A28" stop-opacity=".32"/><stop offset="1" stop-color="#5A3A28" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="root"></div>
<script src="dori_outfits.js"></script>
<script src="dori.js"></script>
<script>
const qs=new URLSearchParams(location.search), G=qs.get('guide')==='1';
const W=1080, H=1920, K='#4A3A33';
function star(cx,cy,r){let d='';for(let i=0;i<10;i++){const rr=i%2?r*.382:r;const a=(-90+i*36)*Math.PI/180;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(2)+' '+(cy+rr*Math.sin(a)).toFixed(2);}return d+'Z';}
// 국기(30×20 좌표, 상자 스티커용 직사각형)
function flagIn(f){
  if(f==='us'){let b='';for(let i=0;i<13;i++)b+=`<rect y="${(i*20/13).toFixed(3)}" width="30" height="${(20/13+.03).toFixed(3)}" fill="${i%2?'#fff':'#C8283C'}"/>`;b+=`<rect width="13" height="10.8" fill="#2E3A7A"/>`;for(let r=0;r<4;r++)for(let c=0;c<5;c++)b+=`<circle cx="${1.5+c*2.5}" cy="${1.4+r*2.6}" r=".55" fill="#fff"/>`;return b;}
  if(f==='jp')return `<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#C8102E"/>`;
  if(f==='cn')return `<rect width="30" height="20" fill="#E3242B"/><path d="${star(8,7,3.2)}" fill="#FFD84A"/>`+[[13,3.5],[15,6],[15,9],[13,11.5]].map(([x,y])=>`<path d="${star(x,y,1.1)}" fill="#FFD84A"/>`).join('');
  return '';}
// 택배 상자(2026-11-08 사용자 "박스가 좀 이상해" → 시안 A+ 선택): 정면 + 윗면 + 옆면(비스듬 투영), 테이프는 평평하게, 비행기 실루엣 스티커, 국기 스티커는 fl('cn'|'us'|'jp')일 때만
const PLANE=(cx,cy,r,rot=-35)=>`<g transform="translate(${cx} ${cy}) rotate(${rot})"><circle r="${r}" fill="#5B8CFF" stroke="${K}" stroke-width="4"/>
  <g transform="scale(${r/24})" fill="#fff"><rect x="-2.6" y="-15" width="5.2" height="28" rx="2.6"/><path d="M-2 -3 L-15 4 L-15 7 L-2 3 Z M2 -3 L15 4 L15 7 L2 3 Z"/><path d="M-1.5 9 L-7 13 L-7 15 L-1.5 13 Z M1.5 9 L7 13 L7 15 L1.5 13 Z"/></g></g>`;
const PARCEL=(w,fl)=>`<svg viewBox="0 0 270 300" width="${w}" height="${w*300/270}" style="overflow:visible">
  <ellipse cx="138" cy="276" rx="128" ry="16" fill="url(#gSh2)"/>
  <path d="M30 110 L82 72 L242 72 L190 110 Z" fill="url(#gTop)" stroke="${K}" stroke-width="6" stroke-linejoin="round"/>
  <path d="M190 110 L242 72 L242 232 L190 270 Z" fill="url(#gSide)" stroke="${K}" stroke-width="6" stroke-linejoin="round"/>
  <rect x="30" y="110" width="160" height="160" rx="4" fill="url(#gFront)" stroke="${K}" stroke-width="6" stroke-linejoin="round"/>
  <path d="M56 91 L216 91" stroke="${K}" stroke-width="3.5" stroke-linecap="round" opacity=".45"/>
  <path d="M95 110 L147 72 L167 72 L115 110 Z" fill="#FBE7C2" opacity=".95"/>
  <path d="M95 110 L147 72 M115 110 L167 72" stroke="${K}" stroke-width="3" opacity=".35"/>
  <rect x="95" y="110" width="20" height="44" fill="#FBE7C2" opacity=".95"/>
  <path d="M95 154 L115 154" stroke="${K}" stroke-width="3" opacity=".35"/>
  <rect x="44" y="186" width="80" height="58" rx="7" fill="#FFFFFF" stroke="${K}" stroke-width="4"/>
  <path d="M56 204 H110 M56 220 H96" stroke="#B9A99A" stroke-width="5" stroke-linecap="round"/>
  ${fl?`<g transform="translate(132 126)"><rect width="46" height="32" rx="5" fill="#fff" stroke="${K}" stroke-width="4"/><g transform="translate(4 4) scale(1.27 1.2)">${flagIn(fl)}</g><rect width="46" height="32" rx="5" fill="none" stroke="${K}" stroke-width="4"/></g>`:''}
  ${PLANE(160,226,20)}
  <path d="M40 124 L40 250" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/>
</svg>`;
// 꼬리표 — 셋 모두 같은 "?%"
const TAG=(rot)=>`<svg viewBox="-70 -110 140 190" width="140" height="190" style="overflow:visible;transform:rotate(${rot}deg)">
  <path d="M0 -104 C-18 -78 -8 -58 0 -40" fill="none" stroke="${K}" stroke-width="4" stroke-linecap="round"/>
  <path d="M-54 -40 L36 -40 L58 0 L36 40 L-54 40 Z" fill="#FFFDF6" stroke="${K}" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="34" cy="0" r="7" fill="#FFF6EC" stroke="${K}" stroke-width="4"/>
  <text x="-12" y="18" text-anchor="middle" font-family="Jua" font-size="50" fill="#E2483A">?%</text></svg>`;
const base={t:1.2,blink:0,happy:0,squint:0,surprise:0,sad:0,open:0,gx:0,gy:0,pouch:0,armL:0,armR:0,earL:0,earR:0,hop:0,squash:0,breath:0,tilt:0};
const root=document.getElementById('root');
root.innerHTML=`<div class="frame" id="f" style="width:${W}px;height:${H}px"></div>`;
const f=document.getElementById('f');
const add=(html)=>{f.insertAdjacentHTML('beforeend',html);return f.lastElementChild;};
function blobs(list){list.forEach(([x,y,s,c])=>add(`<div class="blob" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:radial-gradient(circle,${c} 0%,${c}00 68%)"></div>`));}
function dori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*560/540}px"></div>`);Dori.mount(d,{outfit:CFG.outfit||''});Dori.draw({...base,...st});return d;}

// ===== EX.07 해외직구 — 현관에 도착한 해외 택배 장면 =====
// 핵심 띠 y 600~1320 · x 90~960: 제목 + 국기 스티커 붙은 상자 셋(꼬리표 "?%" 모두 같게) / 보조 y 380~1540: 딱지·도리 / 그 밖은 하늘·바닥(배경)
// 답(감소 폭·어느 나라가 늘었는지)을 드러내지 않는다.
const CFG={outfit:'news'};   // index.html 의 OUTFIT 과 같게
f.style.background='linear-gradient(180deg,#E6F3FA 0%,#F3F8F6 22%,#FFF6EC 40%,#FFF3E6 100%)';
// 하늘 — 맨 위 배경: 점선 비행길 + 구름 + 작은 비행기(글자 없음)
add(`<svg class="abs" style="left:0;top:0" width="1080" height="420" viewBox="0 0 1080 420">
  ${[[150,120,90],[520,80,70],[880,150,100]].map(([x,y,r])=>`<g opacity=".95"><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.42}" fill="#fff"/><ellipse cx="${x-r*.45}" cy="${y+6}" rx="${r*.55}" ry="${r*.34}" fill="#fff"/><ellipse cx="${x+r*.2}" cy="${y-r*.22}" rx="${r*.5}" ry="${r*.36}" fill="#fff"/></g>`).join('')}
  <path d="M40 330 C260 210 520 300 760 190 C860 146 940 120 1040 110" fill="none" stroke="#9FB7D6" stroke-width="7" stroke-dasharray="18 16" stroke-linecap="round"/>
  <g transform="translate(980 112) rotate(-12)"><path d="M-46 4 L40 -6 C52 -7 60 -2 60 4 C60 10 52 14 40 13 L-46 12 Z" fill="#fff" stroke="${K}" stroke-width="5"/><path d="M0 0 L-24 -40 L-10 -40 L22 -2 Z M0 10 L-22 46 L-8 46 L22 12 Z" fill="#DCE4EC" stroke="${K}" stroke-width="5" stroke-linejoin="round"/><path d="M-44 4 L-58 -22 L-46 -22 L-30 2 Z" fill="#2E9C83" stroke="${K}" stroke-width="4" stroke-linejoin="round"/></g></svg>`);
blobs([[-280,520,860,'#FFE7D6'],[600,540,700,'#FFF0C8'],[-200,980,640,'#E2F4EC']]);
// 바닥 — 나무 마루 + 현관 매트
add(`<div class="abs" style="left:0;top:1100px;width:1080px;height:820px;background:
  repeating-linear-gradient(90deg,rgba(74,58,51,.10) 0 4px,transparent 4px 180px),
  linear-gradient(180deg,#E2B27C 0%,#C98E5C 100%);border-top:8px solid #4A3A33"></div>`);
add(`<div class="abs" style="left:330px;top:1230px;width:660px;height:120px;border-radius:30px;background:repeating-linear-gradient(90deg,#5E8E7A 0 26px,#6FA08A 26px 52px);border:6px solid #4A3A33;transform:perspective(600px) rotateX(38deg);transform-origin:50% 0"></div>`);
// 상자 셋(뒤 → 앞) + 꼬리표
// 상자 셋 — 반듯하게(기울이지 않음): 뒤 둘(중국·미국)은 나란히, 앞 하나(일본)는 가운데 아래. 스티커가 가려지지 않게. 꼬리표 셋 모두 "?%"
add(`<div class="abs" style="left:300px;top:800px">${PARCEL(330,'cn')}</div>`);
add(`<div class="abs" style="left:612px;top:800px">${PARCEL(330,'us')}</div>`);
add(`<div class="abs" style="left:470px;top:1010px">${PARCEL(330,'jp')}</div>`);
add(`<div class="abs" style="left:296px;top:812px">${TAG(-10)}</div>`);
add(`<div class="abs" style="left:818px;top:800px">${TAG(8)}</div>`);
add(`<div class="abs" style="left:708px;top:1066px">${TAG(6)}</div>`);
// 제목 — 흰 테두리 스티커 글씨(질문, 답 없음)
add(`<div class="abs title" style="left:92px;top:604px;font-size:118px;-webkit-text-stroke:16px #fff;paint-order:stroke fill;text-shadow:0 10px 0 rgba(62,47,37,.12)"><span class="hl">해외 직구</span>,<br><span style="color:#E2483A">정말 줄었을까?</span></div>`);
// '블프 앞두고' 딱지 — 보조 영역
add(`<div class="abs J" style="left:640px;top:440px;transform:rotate(-7deg);background:#fff;border:6px solid #4A3A33;border-radius:24px;padding:10px 26px 8px;font-size:46px;line-height:1.1;text-align:center;box-shadow:0 10px 0 rgba(62,47,37,.14)"><span style="font-size:30px;color:#7E6B5C">블프 앞두고</span><br><span style="color:#5B8CFF">작년보다 ?%</span></div>`);
// 반짝이
[[930,760,26],[66,900,22],[968,1180,20],[360,470,18]].forEach(([x,y,r])=>add(`<svg class="abs" style="left:${x-r}px;top:${y-r}px" width="${2*r}" height="${2*r}" viewBox="-10 -10 20 20"><path d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#FFD45C" stroke="#4A3A33" stroke-width="1.4"/></svg>`));
// 도리 — 상자 앞에서 깜짝
dori(0,1080,420,{tilt:-7,gx:.75,gy:-.45,armL:.7,armR:.9,earL:4,earR:4,surprise:.75,open:.55});
if(G){
  add(`<div class="abs" style="left:0;top:0;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:0;top:1540px;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:960px;top:0;width:120px;height:1920px;background:rgba(226,72,58,.12)"></div><div class="abs" style="left:0;top:600px;width:1080px;height:720px;border-top:4px dashed #2E9C83;border-bottom:4px dashed #2E9C83"></div><div class="abs" style="left:0;top:285px;width:1080px;height:1350px;border-top:4px dotted #5B8CFF;border-bottom:4px dotted #5B8CFF"></div>`);
}
document.fonts.ready.then(()=>{setTimeout(()=>{window.__ready=true;},300);});
</script>
</body>
</html>
