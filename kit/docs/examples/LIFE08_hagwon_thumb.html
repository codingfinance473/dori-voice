<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도리 썸네일</title>
<link rel="stylesheet" href="jua/index.css">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.otf);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.otf);font-weight:900}
:root{--cream:#FFF6EC;--ink:#3E2F25;--mint:#2E9C83;--red:#E2483A;--yel:#FFD45C;--blue:#5B8CFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);font-family:P,sans-serif;color:var(--ink);word-break:keep-all}
.frame{position:relative;overflow:hidden;background:var(--cream)}
.abs{position:absolute}
.J{font-family:Jua;font-weight:400}
.blob{position:absolute;border-radius:50%}
.title{isolation:isolate;font-family:Jua;line-height:1.08;letter-spacing:-2px;color:var(--ink)}
.hl{position:relative;display:inline-block}
.hl:before{content:"";position:absolute;left:-10px;right:-10px;bottom:6%;height:34%;background:var(--yel);border-radius:14px;z-index:-1;transform:rotate(-1.5deg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gLens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FC"/><stop offset="1" stop-color="#A9C8E8"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7B57E"/><stop offset="1" stop-color="#C98C55"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E7A63"/><stop offset="1" stop-color="#355A48"/></linearGradient>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".55" stop-color="#8FB7FF"/><stop offset="1" stop-color="#E3F0FF"/></linearGradient>
  <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3E9DD"/></linearGradient>
  <linearGradient id="gCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9DB0DA"/><stop offset="1" stop-color="#5E6F9C"/></linearGradient>
  <radialGradient id="gCoin" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".5" stop-color="#F4C64E"/><stop offset="1" stop-color="#C98F1E"/></radialGradient>
  <radialGradient id="gSh2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5A3A28" stop-opacity=".32"/><stop offset="1" stop-color="#5A3A28" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="root"></div>
<script src="dori_outfits.js"></script>
<script src="dori.js"></script>
<script src="mori.js"></script>
<script>
const qs=new URLSearchParams(location.search), G=qs.get('guide')==='1';
const W=1080, H=1920, K='#4A3A33';
const base={t:1.2,blink:0,happy:0,squint:0,surprise:0,sad:0,open:0,gx:0,gy:0,pouch:0,armL:0,armR:0,earL:0,earR:0,hop:0,squash:0,breath:0,tilt:0};
const root=document.getElementById('root');
root.innerHTML=`<div class="frame" id="f" style="width:${W}px;height:${H}px"></div>`;
const f=document.getElementById('f');
const add=(html)=>{f.insertAdjacentHTML('beforeend',html);return f.lastElementChild;};
function blobs(list){list.forEach(([x,y,s,c])=>add(`<div class="blob" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:radial-gradient(circle,${c} 0%,${c}00 68%)"></div>`));}
function dori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);Dori.mount(d,{outfit:CFG.outfit||''});Dori.draw({...base,...st});return d;}
function mori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);const m=Mori.mount(d,{variant:'cream'});m.draw(st);return d;}

// ===== LIFE.08 학원비 할인카드 — 학원 접수대 장면: 뒤엔 학원 창문·게시판, 가운데 접수대 위엔 카드와 "10%" 쿠폰·학원비 영수증, 도리(졸업식 옷)는 깜짝, 모리는 의심 =====
// 핵심 띠 y 600~1320 · x 90~960: 제목 + 카드·쿠폰 / 보조 y 380~1540: 도리·모리 / 그 밖은 벽·바닥. 답(실제 얼마인지)은 드러내지 않는다. 카드에 상표·이름 없음.
const CFG={outfit:'trivia'};   // index.html 의 OUTFIT 과 같게
const CARDP=(w)=>`<svg viewBox="0 0 320 212" width="${w}" height="${w*212/320}" style="overflow:visible">
  <ellipse cx="160" cy="204" rx="150" ry="9" fill="url(#gSh2)"/>
  <rect x="10" y="12" width="306" height="186" rx="22" fill="#4E5C82"/>
  <rect x="4" y="4" width="306" height="186" rx="22" fill="url(#gCard)" stroke="${K}" stroke-width="7"/>
  <rect x="32" y="58" width="60" height="46" rx="9" fill="url(#gCoin)" stroke="${K}" stroke-width="4"/><path d="M32 81 H92 M62 58 V104" stroke="#B57E14" stroke-width="3"/>
  <path d="M32 138 H128 M148 138 H206 M32 164 H112" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".78"/>
  <path d="M236 150 l10 18 l20 3 l-15 14 l4 20 l-19 -10 l-19 10 l4 -20 l-15 -14 l20 -3 z" fill="#FFD45C" stroke="${K}" stroke-width="4" stroke-linejoin="round" transform="translate(16 -22) scale(.8)"/>
  <path d="M24 30 C70 15 150 11 216 15" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".45"/>
</svg>`;
const COUPON=(w,txt,c='#E2483A')=>`<svg viewBox="0 0 220 120" width="${w}" height="${w*120/220}" style="overflow:visible">
  <path d="M16 14 H212 a8 8 0 0 1 8 8 V50 a16 16 0 0 0 0 32 V110 a8 8 0 0 1 -8 8 H16 a8 8 0 0 1 -8 -8 V82 a16 16 0 0 0 0 -32 V22 a8 8 0 0 1 8 -8 Z" fill="rgba(74,58,51,.2)"/>
  <path d="M12 6 H208 a8 8 0 0 1 8 8 V42 a16 16 0 0 0 0 32 V102 a8 8 0 0 1 -8 8 H12 a8 8 0 0 1 -8 -8 V74 a16 16 0 0 0 0 -32 V14 a8 8 0 0 1 8 -8 Z" fill="${c}" stroke="${K}" stroke-width="6" stroke-linejoin="round"/>
  <path d="M60 14 V102" stroke="#fff" stroke-width="4" stroke-dasharray="8 8" opacity=".7"/>
  <text x="138" y="79" text-anchor="middle" font-family="Jua" font-size="58" fill="#fff">${txt}</text>
  <path d="M74 22 H150" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".45"/>
</svg>`;
const RCPT=(w,ttl='학원비')=>`<svg viewBox="0 0 200 270" width="${w}" height="${w*270/200}" style="overflow:visible">
  <path d="M14 12 H194 V252 L176 264 L158 252 L140 264 L122 252 L104 264 L86 252 L68 264 L50 252 L32 264 L14 252 Z" fill="#D9CBBB"/>
  <path d="M6 4 H186 V244 L168 256 L150 244 L132 256 L114 244 L96 256 L78 244 L60 256 L42 244 L24 256 L6 244 Z" fill="url(#gPaper)" stroke="${K}" stroke-width="5" stroke-linejoin="round"/>
  <text x="96" y="46" text-anchor="middle" font-family="Jua" font-size="32" fill="${K}">${ttl}</text>
  <path d="M24 64 H168" stroke="#C9B8A7" stroke-width="4" stroke-dasharray="6 6"/>
  <path d="M24 94 H110 M24 124 H130 M24 154 H96" stroke="#C9B8A7" stroke-width="8" stroke-linecap="round"/>
  <path d="M134 94 H168 M146 124 H168 M126 154 H168" stroke="#E6D6C8" stroke-width="8" stroke-linecap="round"/>
  <path d="M24 186 H168" stroke="#C9B8A7" stroke-width="4"/>
  <rect x="92" y="200" width="76" height="24" rx="6" fill="#F3B7AE"/>
</svg>`;
const BOOKS=w=>`<svg viewBox="0 0 240 200" width="${w}" height="${w*200/240}" style="overflow:visible">
  <ellipse cx="112" cy="192" rx="106" ry="9" fill="url(#gSh2)"/>
  <rect x="14" y="140" width="190" height="44" rx="8" fill="#5B8CFF" stroke="${K}" stroke-width="6"/><rect x="24" y="150" width="170" height="10" rx="4" fill="#fff" opacity=".7"/>
  <rect x="28" y="96" width="170" height="44" rx="8" fill="#FFD45C" stroke="${K}" stroke-width="6"/><rect x="38" y="106" width="150" height="10" rx="4" fill="#fff" opacity=".7"/>
  <rect x="20" y="52" width="176" height="44" rx="8" fill="#2E9C83" stroke="${K}" stroke-width="6"/><rect x="30" y="62" width="156" height="10" rx="4" fill="#fff" opacity=".7"/>
  <g transform="rotate(-24 150 30)"><rect x="96" y="18" width="104" height="20" rx="4" fill="#F4C64E" stroke="${K}" stroke-width="5"/><path d="M200 18 L226 28 L200 38 Z" fill="#F6E3C8" stroke="${K}" stroke-width="5" stroke-linejoin="round"/><rect x="84" y="18" width="16" height="20" rx="4" fill="#F3B7AE" stroke="${K}" stroke-width="5"/></g>
</svg>`;

f.style.background='linear-gradient(180deg,#FFF1DC 0%,#FFF6EC 45%,#FFF3E6 100%)';
add(`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;background-image:radial-gradient(rgba(74,58,51,.07) 2px,transparent 2.5px);background-size:46px 46px"></div>`);
// 줄무늬 차양(배경, 글자 없음)
add(`<svg class="abs" style="left:0;top:0" width="1080" height="250" viewBox="0 0 1080 250">
  ${[...Array(9)].map((_,i)=>`<path d="M${i*120} 0 H${i*120+120} V170 a60 60 0 0 1 -120 0 Z" fill="${i%2?'#FFFDF8':'#E8833A'}" stroke="${K}" stroke-width="7"/>`).join('')}
</svg>`);
// 게시판(배경) — 시간표 낙서만
add(`<svg class="abs" style="left:70px;top:300px" width="420" height="270" viewBox="0 0 420 270">
  <rect x="8" y="8" width="404" height="250" rx="22" fill="#B98F65" stroke="${K}" stroke-width="8"/>
  <rect x="30" y="30" width="360" height="206" rx="12" fill="#FFFDF8" stroke="${K}" stroke-width="5"/>
  ${[0,1,2].map(r=>[0,1,2,3].map(c=>`<rect x="${52+c*82}" y="${54+r*56}" width="66" height="40" rx="8" fill="${['#DCE9FF','#FFE9B8','#DDF3EA','#FBDAD5'][(r+c)%4]}" stroke="${K}" stroke-width="3"/>`).join('')).join('')}
</svg>`);
// 창문(배경)
add(`<svg class="abs" style="left:590px;top:290px" width="400" height="290" viewBox="0 0 400 290">
  <rect x="10" y="10" width="380" height="260" rx="24" fill="#CFE6F7" stroke="${K}" stroke-width="8"/>
  <path d="M200 10 V270 M10 140 H390" stroke="${K}" stroke-width="7"/>
  <path d="M50 60 L120 30 M70 100 L150 62 M250 220 L330 182" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".7"/>
</svg>`);
blobs([[-260,620,800,'#FFE7D6'],[560,620,680,'#FFF0C8'],[-200,1040,640,'#E8F2FA']]);
// 바닥 — 나무 마루
add(`<div class="abs" style="left:0;top:1360px;width:1080px;height:560px;background:
  repeating-linear-gradient(90deg,rgba(74,58,51,.10) 0 4px,transparent 4px 180px),
  linear-gradient(180deg,#E2B27C 0%,#C98E5C 100%);border-top:8px solid ${K}"></div>`);
// 접수대(가운데)
add(`<svg class="abs" style="left:230px;top:1090px" width="620" height="290" viewBox="0 0 620 290">
  <ellipse cx="310" cy="280" rx="280" ry="12" fill="url(#gSh2)"/>
  <rect x="50" y="90" width="520" height="184" rx="14" fill="#C98E5C" stroke="${K}" stroke-width="8"/>
  <path d="M90 130 H530 M90 190 H530" stroke="#A9713F" stroke-width="6" stroke-linecap="round" opacity=".6"/>
  <path d="M14 40 H606 L584 104 H36 Z" fill="url(#gWood)" stroke="${K}" stroke-width="8" stroke-linejoin="round"/>
  <path d="M60 64 H320" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".35"/>
</svg>`);
add(`<div class="abs" style="left:262px;top:930px;transform:rotate(-9deg)">${RCPT(170)}</div>`);
add(`<div class="abs" style="left:372px;top:948px;transform:rotate(-5deg)">${CARDP(400)}</div>`);
add(`<div class="abs" style="left:560px;top:880px;transform:rotate(10deg)">${COUPON(280,'10%')}</div>`);
// "?" 표
add(`<div class="abs J" style="left:150px;top:880px;width:110px;height:110px;border-radius:50%;background:#FFD45C;border:7px solid ${K};color:${K};font-size:76px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 10px 0 rgba(62,47,37,.16)">?</div>`);
// 제목 — 흰 테두리 스티커 글씨(질문, 답 없음)
add(`<div class="abs title" style="left:92px;top:600px;font-size:116px;-webkit-text-stroke:16px #fff;paint-order:stroke fill;text-shadow:0 10px 0 rgba(62,47,37,.12)">학원비 <span class="hl">10% 할인</span><br><span style="color:#E2483A">진짜 10%일까?</span></div>`);
[[940,800,24],[70,1060,22],[250,1320,18],[960,1180,18]].forEach(([x,y,r])=>add(`<svg class="abs" style="left:${x-r}px;top:${y-r}px" width="${2*r}" height="${2*r}" viewBox="-10 -10 20 20"><path d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#FFD45C" stroke="#4A3A33" stroke-width="1.4"/></svg>`));
dori(-20,1050,470,{tilt:-6,gx:.8,gy:-.3,armL:.6,armR:.9,earL:4,earR:4,surprise:.8,open:.5});
mori(702,992,364,{lid:.42,browR:1,gx:-.9,gy:-.1,tilt:-3,tail:.7,armL:.85,smile:1});
if(G){
  add(`<div class="abs" style="left:0;top:0;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:0;top:1540px;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:960px;top:0;width:120px;height:1920px;background:rgba(226,72,58,.12)"></div><div class="abs" style="left:0;top:600px;width:1080px;height:720px;border-top:4px dashed #2E9C83;border-bottom:4px dashed #2E9C83"></div><div class="abs" style="left:0;top:285px;width:1080px;height:1350px;border-top:4px dotted #5B8CFF;border-bottom:4px dotted #5B8CFF"></div>`);
}
document.fonts.ready.then(()=>{setTimeout(()=>{window.__ready=true;},300);});
</script>
</body>
</html>
