<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도리 썸네일</title>
<link rel="stylesheet" href="jua/index.css">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.otf);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.otf);font-weight:900}
:root{--cream:#FFF6EC;--ink:#3E2F25;--mint:#2E9C83;--red:#E2483A;--yel:#FFD45C;--blue:#5B8CFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);font-family:P,sans-serif;color:var(--ink);word-break:keep-all}
.frame{position:relative;overflow:hidden;background:var(--cream)}
.abs{position:absolute}
.J{font-family:Jua;font-weight:400}
.blob{position:absolute;border-radius:50%}
.title{isolation:isolate;font-family:Jua;line-height:1.08;letter-spacing:-2px;color:var(--ink)}
.hl{position:relative;display:inline-block}
.hl:before{content:"";position:absolute;left:-10px;right:-10px;bottom:6%;height:34%;background:var(--yel);border-radius:14px;z-index:-1;transform:rotate(-1.5deg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".55" stop-color="#8FB7FF"/><stop offset="1" stop-color="#E3F0FF"/></linearGradient>
  <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3E9DD"/></linearGradient>
  <radialGradient id="gSh2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5A3A28" stop-opacity=".32"/><stop offset="1" stop-color="#5A3A28" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="root"></div>
<script src="dori_outfits.js"></script>
<script src="dori.js"></script>
<script src="mori.js"></script>
<script>
const qs=new URLSearchParams(location.search), G=qs.get('guide')==='1';
const W=1080, H=1920, K='#4A3A33';
const base={t:1.2,blink:0,happy:0,squint:0,surprise:0,sad:0,open:0,gx:0,gy:0,pouch:0,armL:0,armR:0,earL:0,earR:0,hop:0,squash:0,breath:0,tilt:0};
const root=document.getElementById('root');
root.innerHTML=`<div class="frame" id="f" style="width:${W}px;height:${H}px"></div>`;
const f=document.getElementById('f');
const add=(html)=>{f.insertAdjacentHTML('beforeend',html);return f.lastElementChild;};
function blobs(list){list.forEach(([x,y,s,c])=>add(`<div class="blob" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:radial-gradient(circle,${c} 0%,${c}00 68%)"></div>`));}
function dori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);Dori.mount(d,{outfit:CFG.outfit||''});Dori.draw({...base,...st});return d;}
function mori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);const m=Mori.mount(d,{variant:'cream'});m.draw(st);return d;}

// ===== EX.08 도시가스 — 겨울 거실 장면: 창밖엔 눈, 벽엔 보일러 조절기, 가운데엔 "?원" 고지서, 도리(겨울옷)와 모리가 양쪽에서 본다 =====
// 핵심 띠 y 600~1320 · x 90~960: 제목 + 고지서 "?원" / 보조 y 380~1540: 창문·조절기·도리·모리 / 그 밖은 벽·바닥(배경). 답(올랐는지 아닌지)은 드러내지 않는다.
const CFG={outfit:'winter'};   // index.html 의 OUTFIT 과 같게
f.style.background='linear-gradient(180deg,#FDEEE2 0%,#FFF6EC 45%,#FFF3E6 100%)';
// 벽 잔무늬
add(`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;background-image:radial-gradient(rgba(74,58,51,.07) 2px,transparent 2.5px);background-size:46px 46px"></div>`);
// 창문(위, 배경) — 눈 내리는 밤하늘
add(`<div class="abs" style="left:560px;top:120px;width:420px;height:460px;border-radius:34px;border:8px solid ${K};background:linear-gradient(180deg,#7FA9E0 0%,#BBD6F3 70%,#E6F0FA 100%);overflow:hidden;box-shadow:0 14px 0 rgba(74,58,51,.16)">
  <div class="abs" style="left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:${K};opacity:.85"></div><div class="abs" style="top:50%;left:0;right:0;height:12px;margin-top:-6px;background:${K};opacity:.85"></div>
  ${[[40,60,16],[120,180,12],[300,90,18],[360,260,14],[200,330,16],[80,400,12],[330,400,10],[250,30,10]].map(([x,y,r])=>`<div class="abs" style="left:${x}px;top:${y}px;width:${r}px;height:${r}px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(74,58,51,.15)"></div>`).join('')}
</div>`);
add(`<div class="abs" style="left:530px;top:566px;width:480px;height:40px;border-radius:14px;background:#fff;border:6px solid ${K};box-shadow:0 8px 0 rgba(74,58,51,.16)"></div>`);
// 보일러 조절기(왼쪽 위 벽, 배경) — 글자 없이 눈금과 불꽃만
add(`<svg class="abs" style="left:110px;top:170px" width="300" height="300" viewBox="0 0 300 300">
  <rect x="20" y="20" width="260" height="260" rx="36" fill="#FFFDF8" stroke="${K}" stroke-width="8"/>
  <circle cx="150" cy="140" r="78" fill="#F3E9DD" stroke="${K}" stroke-width="7"/>
  <circle cx="150" cy="140" r="56" fill="#fff" stroke="${K}" stroke-width="5"/>
  <path d="M150 140 L186 100" stroke="#E2483A" stroke-width="9" stroke-linecap="round"/>
  <circle cx="150" cy="140" r="10" fill="${K}"/>
  <rect x="60" y="232" width="180" height="22" rx="11" fill="#E6D6C8"/>
</svg>`);
blobs([[-260,620,800,'#FFE7D6'],[560,620,680,'#FFF0C8'],[-200,1040,640,'#E8F2FA']]);
// 바닥 — 나무 마루
add(`<div class="abs" style="left:0;top:1360px;width:1080px;height:560px;background:
  repeating-linear-gradient(90deg,rgba(74,58,51,.10) 0 4px,transparent 4px 180px),
  linear-gradient(180deg,#E2B27C 0%,#C98E5C 100%);border-top:8px solid ${K}"></div>`);
// 고지서(가운데, 핵심 그림) — "?원"만, 답 없음
add(`<svg class="abs" style="left:330px;top:832px" width="430" height="502" viewBox="0 0 480 560">
  <ellipse cx="240" cy="548" rx="200" ry="14" fill="url(#gSh2)"/>
  <g transform="rotate(-3 240 280)">
    <rect x="40" y="30" width="400" height="500" rx="22" fill="url(#gPaper)" stroke="${K}" stroke-width="8"/>
    <rect x="40" y="30" width="400" height="86" rx="22" fill="#E8833A" stroke="${K}" stroke-width="8"/>
    <rect x="40" y="90" width="400" height="26" fill="#E8833A"/>
    <text x="240" y="88" text-anchor="middle" font-family="Jua" font-size="46" fill="#fff">도시가스 요금</text>
    <g transform="translate(280 60) scale(.25) translate(-150 -140)"><path d="M150 6 C162 30 186 44 186 80 C186 108 170 124 150 124 C130 124 114 108 114 80 C114 56 130 44 136 30 C140 44 148 48 150 40 Z" fill="url(#gFlame)" stroke="${K}" stroke-width="12"/></g>
    ${[160,206,252].map((y,i)=>`<rect x="84" y="${y}" width="${[220,160,190][i]}" height="18" rx="9" fill="#D9C9BA"/>`).join('')}
    <rect x="84" y="320" width="312" height="6" fill="${K}" opacity=".35"/>
    <text x="240" y="470" text-anchor="middle" font-family="Jua" font-size="170" fill="#E2483A">?</text>
    <text x="372" y="470" text-anchor="middle" font-family="Jua" font-size="70" fill="${K}">원</text>
  </g>
</svg>`);
// 제목 — 흰 테두리 스티커 글씨(질문, 답 없음)
add(`<div class="abs title" style="left:92px;top:586px;font-size:112px;-webkit-text-stroke:16px #fff;paint-order:stroke fill;text-shadow:0 10px 0 rgba(62,47,37,.12)">올겨울 <span class="hl">가스요금</span>,<br><span style="color:#E2483A">진짜 안 올랐어?</span></div>`);
// 딱지 — 보조 영역(핵심 띠 안 윗부분)
add(`<div class="abs J" style="left:86px;top:985px;transform:rotate(-6deg);background:#fff;border:6px solid ${K};border-radius:24px;padding:10px 26px 8px;font-size:44px;line-height:1.1;text-align:center;box-shadow:0 10px 0 rgba(62,47,37,.14)"><span style="font-size:28px;color:#7E6B5C">작년 겨울보다</span><br><span style="color:#5B8CFF">▲ ?%</span></div>`);
// 반짝이
[[940,700,24],[70,920,22],[250,1300,18],[960,1180,18]].forEach(([x,y,r])=>add(`<svg class="abs" style="left:${x-r}px;top:${y-r}px" width="${2*r}" height="${2*r}" viewBox="-10 -10 20 20"><path d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#FFD45C" stroke="#4A3A33" stroke-width="1.4"/></svg>`));
// 도리(겨울옷) — 고지서 앞에서 깜짝 / 모리 — 반쯤 감은 눈으로 의심
dori(-20,1050,470,{tilt:-6,gx:.8,gy:-.3,armL:.6,armR:.9,earL:4,earR:4,surprise:.8,open:.5});
mori(702,992,364,{lid:.42,browR:1,gx:-.9,gy:-.1,tilt:-3,tail:.7,armL:.85,smile:1});
if(G){
  add(`<div class="abs" style="left:0;top:0;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:0;top:1540px;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:960px;top:0;width:120px;height:1920px;background:rgba(226,72,58,.12)"></div><div class="abs" style="left:0;top:600px;width:1080px;height:720px;border-top:4px dashed #2E9C83;border-bottom:4px dashed #2E9C83"></div><div class="abs" style="left:0;top:285px;width:1080px;height:1350px;border-top:4px dotted #5B8CFF;border-bottom:4px dotted #5B8CFF"></div>`);
}
document.fonts.ready.then(()=>{setTimeout(()=>{window.__ready=true;},300);});
</script>
</body>
</html>
