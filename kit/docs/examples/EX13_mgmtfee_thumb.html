<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도리 썸네일</title>
<link rel="stylesheet" href="jua/index.css">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.otf);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.otf);font-weight:900}
:root{--cream:#FFF6EC;--ink:#3E2F25;--mint:#2E9C83;--red:#E2483A;--yel:#FFD45C;--blue:#5B8CFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);font-family:P,sans-serif;color:var(--ink);word-break:keep-all}
.frame{position:relative;overflow:hidden;background:var(--cream)}
.abs{position:absolute}
.J{font-family:Jua;font-weight:400}
.blob{position:absolute;border-radius:50%}
.title{isolation:isolate;font-family:Jua;line-height:1.08;letter-spacing:-2px;color:var(--ink)}
.hl{position:relative;display:inline-block}
.hl:before{content:"";position:absolute;left:-10px;right:-10px;bottom:6%;height:34%;background:var(--yel);border-radius:14px;z-index:-1;transform:rotate(-1.5deg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gLens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FC"/><stop offset="1" stop-color="#A9C8E8"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7B57E"/><stop offset="1" stop-color="#C98C55"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E7A63"/><stop offset="1" stop-color="#355A48"/></linearGradient>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".55" stop-color="#8FB7FF"/><stop offset="1" stop-color="#E3F0FF"/></linearGradient>
  <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3E9DD"/></linearGradient>
  <radialGradient id="gSh2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5A3A28" stop-opacity=".32"/><stop offset="1" stop-color="#5A3A28" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="root"></div>
<script src="dori_outfits.js"></script>
<script src="dori.js"></script>
<script src="mori.js"></script>
<script>
const qs=new URLSearchParams(location.search), G=qs.get('guide')==='1';
const W=1080, H=1920, K='#4A3A33';
const base={t:1.2,blink:0,happy:0,squint:0,surprise:0,sad:0,open:0,gx:0,gy:0,pouch:0,armL:0,armR:0,earL:0,earR:0,hop:0,squash:0,breath:0,tilt:0};
const root=document.getElementById('root');
root.innerHTML=`<div class="frame" id="f" style="width:${W}px;height:${H}px"></div>`;
const f=document.getElementById('f');
const add=(html)=>{f.insertAdjacentHTML('beforeend',html);return f.lastElementChild;};
function blobs(list){list.forEach(([x,y,s,c])=>add(`<div class="blob" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:radial-gradient(circle,${c} 0%,${c}00 68%)"></div>`));}
function dori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);Dori.mount(d,{outfit:CFG.outfit||''});Dori.draw({...base,...st});return d;}
function mori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);const m=Mori.mount(d,{variant:'cream'});m.draw(st);return d;}

// ===== EX.13 아파트 관리비 — 아파트 단지 장면: 뒤엔 하늘과 아파트 동(창문 불빛), 가운데 큰 관리비 고지서(합계 "?원") + 평면도 셋(59·84·114㎡, 가격 ?) =====
// 핵심 띠 y 600~1320 · x 90~960: 제목 + 고지서·평면도 / 보조 y 380~1540: 도리·모리 / 그 밖은 하늘·바닥. 답(평균값·판정)은 드러내지 않는다.
const CFG={outfit:'winter'};   // index.html 의 OUTFIT 과 같게
document.querySelector('svg defs').insertAdjacentHTML('beforeend',`<linearGradient id="gBldg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F3ECE4"/><stop offset="1" stop-color="#D9CFC4"/></linearGradient>`);
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const APT=(w,cols,rows,seed)=>{const r=rng(seed),Wd=60+cols*44,Ht=70+rows*50;let win='';
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const on=r()<.4;win+=`<rect x="${40+x*44}" y="${46+y*50}" width="28" height="32" rx="5" fill="${on?'#FFE69A':'#BFD3EA'}" stroke="${K}" stroke-width="3.5"/>`;}
 return `<svg viewBox="0 0 ${Wd+40} ${Ht+40}" width="${w}" height="${w*(Ht+40)/(Wd+40)}"><rect x="20" y="30" width="${Wd}" height="${Ht}" rx="8" fill="url(#gBldg)" stroke="${K}" stroke-width="6"/><rect x="12" y="14" width="${Wd+16}" height="24" rx="8" fill="#C98C55" stroke="${K}" stroke-width="6"/><path d="M30 40 V${Ht+16}" stroke="#fff" stroke-width="7" opacity=".45" stroke-linecap="round"/>${win}</svg>`;};
const BILL=(w)=>`<svg viewBox="0 0 300 420" width="${w}" height="${w*1.4}" style="overflow:visible">
  <ellipse cx="150" cy="414" rx="130" ry="10" fill="url(#gSh2)"/>
  <path d="M18 14 H282 V398 L262 384 L242 398 L222 384 L202 398 L182 384 L162 398 L142 384 L122 398 L102 384 L82 398 L62 384 L42 398 L18 384 Z" fill="url(#gPaper)" stroke="${K}" stroke-width="6" stroke-linejoin="round"/>
  <rect x="18" y="14" width="264" height="62" fill="#2E9C83" stroke="${K}" stroke-width="6"/>
  <text x="150" y="56" text-anchor="middle" font-family="Jua" font-size="34" fill="#fff">관리비 고지서</text>
  ${['공용관리비','개별사용료','장기수선충당금'].map((t,i)=>`<text x="40" y="${122+i*44}" font-family="P" font-weight="800" font-size="22" fill="#6B5848">${t}</text><path d="M206 ${116+i*44} H258" stroke="#C9B8A7" stroke-width="7" stroke-linecap="round"/>`).join('')}
  <path d="M36 240 H264" stroke="${K}" stroke-width="4" stroke-dasharray="8 8"/>
 </svg>`;
const PLAN=(s,hi)=>`<svg viewBox="0 0 200 200" width="${s}" height="${s}"><rect x="6" y="10" width="188" height="188" rx="10" fill="#C9A985" opacity=".45"/><rect x="4" y="4" width="188" height="188" rx="10" fill="${hi?'#FFF3D9':'#FFFAF1'}" stroke="${K}" stroke-width="8"/><path d="M4 104 H110 V192 M110 104 V4 M110 70 H192" fill="none" stroke="${K}" stroke-width="6"/>${[...Array(5)].map((_,i)=>`<path d="M${120+i*16} 112 V186" stroke="#E8D4B8" stroke-width="5"/>`).join('')}<rect x="22" y="22" width="62" height="40" rx="8" fill="#B9A3E3" stroke="${K}" stroke-width="5"/><rect x="128" y="18" width="48" height="36" rx="6" fill="#9FE3C9" stroke="${K}" stroke-width="5"/></svg>`;
f.style.background='linear-gradient(180deg,#D6ECFA 0%,#EEF5F4 38%,#FFF6EC 62%,#FFF3E6 100%)';
add(`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;background-image:radial-gradient(rgba(74,58,51,.06) 2px,transparent 2.5px);background-size:46px 46px"></div>`);
// 뒤 아파트 단지(배경, 글자 없음)
add(`<div class="abs" style="left:-30px;top:150px">${APT(300,4,7,3)}</div>`);
add(`<div class="abs" style="left:250px;top:250px">${APT(240,4,5,8)}</div>`);
add(`<div class="abs" style="left:470px;top:120px">${APT(300,4,7,11)}</div>`);
add(`<div class="abs" style="left:760px;top:220px">${APT(330,4,6,5)}</div>`);
add(`<svg class="abs" style="left:880px;top:70px" width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="46" fill="#FFE69A" stroke="${K}" stroke-width="6"/></svg>`);
blobs([[-260,560,800,'#FFE7D6'],[520,600,700,'#FFF0C8']]);
// 마당 바닥
add(`<div class="abs" style="left:0;top:1330px;width:1080px;height:590px;background:
  repeating-linear-gradient(90deg,rgba(74,58,51,.10) 0 4px,transparent 4px 180px),
  linear-gradient(180deg,#E7B57E 0%,#C98E5C 100%);border-top:8px solid ${K}"></div>`);
// 가운데: 고지서(합계 ?원) + 평면도 셋(넓이마다 ?)
add(`<div class="abs" style="left:110px;top:880px;transform:rotate(-5deg)">${BILL(300)}</div>`);
add(`<div class="abs J" style="left:150px;top:1140px;transform:rotate(-6deg);background:#fff;border:6px solid ${K};border-radius:20px;padding:8px 24px 6px;font-size:62px;line-height:1.05;text-align:center;color:#E2483A;box-shadow:0 10px 0 rgba(62,47,37,.14)"><span style="font-size:26px;color:#7E6B5C">이번 달 합계</span><br>?원</div>`);
[[440,1010,110,'59㎡'],[566,970,135,'84㎡'],[716,925,160,'114㎡']].forEach(([x,y,s,l],i)=>{
  add(`<div class="abs" style="left:${x}px;top:${y}px">${PLAN(s,i===1)}</div>`);
  add(`<div class="abs J" style="left:${x+s/2-50}px;top:${y+s+8}px;width:100px;text-align:center;font-size:34px;color:#3E2F25;-webkit-text-stroke:8px #fff;paint-order:stroke fill">${l}</div>`);});
add(`<div class="abs J" style="left:420px;top:1222px;transform:rotate(3deg);background:#FFD45C;border:6px solid ${K};border-radius:999px;padding:8px 28px;font-size:44px;color:#3E2F25;box-shadow:0 8px 0 rgba(62,47,37,.16);white-space:nowrap">평균보다 ▲? ▼?</div>`);
// 제목 — 흰 테두리 스티커 글씨(질문, 답 없음)
add(`<div class="abs title" style="left:92px;top:610px;font-size:118px;-webkit-text-stroke:16px #fff;paint-order:stroke fill;text-shadow:0 10px 0 rgba(62,47,37,.12)"><span class="hl">아파트 관리비</span>,<br><span style="color:#E2483A">우리 집 많이 내?</span></div>`);
[[944,820,24],[70,900,22],[440,1300,16]].forEach(([x,y,r])=>add(`<svg class="abs" style="left:${x-r}px;top:${y-r}px" width="${2*r}" height="${2*r}" viewBox="-10 -10 20 20"><path d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#FFD45C" stroke="#4A3A33" stroke-width="1.4"/></svg>`));
dori(-30,1150,420,{tilt:-6,gx:.8,gy:-.3,armL:.6,armR:.9,earL:4,earR:4,surprise:.8,open:.5});
mori(772,1140,240,{lid:.42,browR:1,gx:-.9,gy:-.1,tilt:-3,tail:.7,armL:0,smile:1});
if(G){
  add(`<div class="abs" style="left:0;top:0;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:0;top:1540px;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:960px;top:0;width:120px;height:1920px;background:rgba(226,72,58,.12)"></div><div class="abs" style="left:0;top:600px;width:1080px;height:720px;border-top:4px dashed #2E9C83;border-bottom:4px dashed #2E9C83"></div><div class="abs" style="left:0;top:285px;width:1080px;height:1350px;border-top:4px dotted #5B8CFF;border-bottom:4px dotted #5B8CFF"></div>`);
}
document.fonts.ready.then(()=>{setTimeout(()=>{window.__ready=true;},300);});
</script>
</body>
</html>
