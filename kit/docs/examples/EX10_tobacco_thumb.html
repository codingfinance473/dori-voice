<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도리 썸네일</title>
<link rel="stylesheet" href="jua/index.css">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.otf);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.otf);font-weight:900}
:root{--cream:#FFF6EC;--ink:#3E2F25;--mint:#2E9C83;--red:#E2483A;--yel:#FFD45C;--blue:#5B8CFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);font-family:P,sans-serif;color:var(--ink);word-break:keep-all}
.frame{position:relative;overflow:hidden;background:var(--cream)}
.abs{position:absolute}
.J{font-family:Jua;font-weight:400}
.blob{position:absolute;border-radius:50%}
.title{isolation:isolate;font-family:Jua;line-height:1.08;letter-spacing:-2px;color:var(--ink)}
.hl{position:relative;display:inline-block}
.hl:before{content:"";position:absolute;left:-10px;right:-10px;bottom:6%;height:34%;background:var(--yel);border-radius:14px;z-index:-1;transform:rotate(-1.5deg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gLens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FC"/><stop offset="1" stop-color="#A9C8E8"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7B57E"/><stop offset="1" stop-color="#C98C55"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E7A63"/><stop offset="1" stop-color="#355A48"/></linearGradient>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".55" stop-color="#8FB7FF"/><stop offset="1" stop-color="#E3F0FF"/></linearGradient>
  <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3E9DD"/></linearGradient>
  <radialGradient id="gSh2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5A3A28" stop-opacity=".32"/><stop offset="1" stop-color="#5A3A28" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="root"></div>
<script src="dori_outfits.js"></script>
<script src="dori.js"></script>
<script src="mori.js"></script>
<script>
const qs=new URLSearchParams(location.search), G=qs.get('guide')==='1';
const W=1080, H=1920, K='#4A3A33';
const base={t:1.2,blink:0,happy:0,squint:0,surprise:0,sad:0,open:0,gx:0,gy:0,pouch:0,armL:0,armR:0,earL:0,earR:0,hop:0,squash:0,breath:0,tilt:0};
const root=document.getElementById('root');
root.innerHTML=`<div class="frame" id="f" style="width:${W}px;height:${H}px"></div>`;
const f=document.getElementById('f');
const add=(html)=>{f.insertAdjacentHTML('beforeend',html);return f.lastElementChild;};
function blobs(list){list.forEach(([x,y,s,c])=>add(`<div class="blob" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:radial-gradient(circle,${c} 0%,${c}00 68%)"></div>`));}
function dori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);Dori.mount(d,{outfit:CFG.outfit||''});Dori.draw({...base,...st});return d;}
function mori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);const m=Mori.mount(d,{variant:'cream'});m.draw(st);return d;}

// ===== EX.10 담뱃값 8500원 — 편의점 계산대 장면: 뒤엔 선반, 가운데 계산대 위 담배 갑(상표 없음)과 가격표 "8500원?", 도리(세무사 옷)는 깜짝, 모리는 의심 =====
// 핵심 띠 y 600~1320 · x 90~960: 제목 + 담배 갑·가격표 / 보조 y 380~1540: 선반 아래쪽·도리·모리 / 그 밖은 벽·바닥. 답(정해졌는지)은 드러내지 않는다.
const CFG={outfit:'tax'};   // index.html 의 OUTFIT 과 같게
document.querySelector('svg defs').insertAdjacentHTML('beforeend',`<linearGradient id="gPack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBF4"/><stop offset="1" stop-color="#E9DCCB"/></linearGradient><linearGradient id="gPackTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93A6C4"/><stop offset="1" stop-color="#5E6F8C"/></linearGradient>`);
const PACK=(w)=>`<svg viewBox="0 0 200 290" width="${w}" height="${w*290/200}" style="overflow:visible">
  <ellipse cx="100" cy="280" rx="92" ry="10" fill="url(#gSh2)"/>
  <rect x="22" y="30" width="156" height="244" rx="14" fill="url(#gPack)" stroke="${K}" stroke-width="7"/>
  <path d="M22 44 Q22 30 36 30 H164 Q178 30 178 44 V104 H22 Z" fill="url(#gPackTop)" stroke="${K}" stroke-width="7" stroke-linejoin="round"/>
  <path d="M22 104 H178" stroke="${K}" stroke-width="5"/>
  <path d="M40 48 H120" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".5"/>
  <rect x="44" y="126" width="112" height="70" rx="12" fill="#fff" stroke="${K}" stroke-width="5"/>
  <text x="100" y="178" text-anchor="middle" font-family="Jua" font-size="46" fill="#3E2F25">담배</text>
  <rect x="44" y="212" width="112" height="44" rx="8" fill="#E6DDD2" stroke="${K}" stroke-width="4"/>
  <path d="M56 228 H144 M56 242 H120" stroke="#B8A999" stroke-width="6" stroke-linecap="round"/>
  <path d="M34 120 V258" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
</svg>`;
f.style.background='linear-gradient(180deg,#EAF1E4 0%,#FFF6EC 45%,#FFF3E6 100%)';
add(`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;background-image:radial-gradient(rgba(74,58,51,.07) 2px,transparent 2.5px);background-size:46px 46px"></div>`);
// 뒤 선반(배경, 글자 없음) — 무늬 없는 상자들
add(`<svg class="abs" style="left:0;top:90px" width="1080" height="520" viewBox="0 0 1080 520">
  ${[0,1,2].map(r=>`<rect x="0" y="${150+r*160}" width="1080" height="18" fill="#C9A985" stroke="${K}" stroke-width="5"/>`).join('')}
  ${[0,1,2].map(r=>[...Array(12)].map((_,i)=>{const c=['#F3B7AE','#B9D7F0','#F8DE9A','#BFE3C6','#D9C7EE'][(i+r*2)%5];const h=92+((i*7+r*3)%3)*12;return `<rect x="${14+i*90}" y="${150+r*160-h}" width="66" height="${h}" rx="9" fill="${c}" stroke="${K}" stroke-width="5"/><path d="M${26+i*90} ${150+r*160-h+16} h34" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".6"/>`;}).join('')).join('')}
</svg>`);
blobs([[-260,560,800,'#FFE7D6'],[520,600,700,'#FFF0C8']]);
// 계산대(나무) — 화면 아래까지
add(`<div class="abs" style="left:0;top:1330px;width:1080px;height:590px;background:
  repeating-linear-gradient(90deg,rgba(74,58,51,.10) 0 4px,transparent 4px 180px),
  linear-gradient(180deg,#E7B57E 0%,#C98E5C 100%);border-top:8px solid ${K}"></div>`);
// 진열 선반(갑·가격표가 떠 보이지 않게)
add(`<div class="abs" style="left:120px;top:1252px;width:640px;height:26px;border-radius:8px;background:#C9A985;border:6px solid ${K};box-shadow:0 8px 0 rgba(62,47,37,.12)"></div>`);
// 가운데: 담배 갑(핵심 그림) + 가격표 둘 — 모리(오른쪽 x 740~)·도리(왼쪽 아래)에 가리지 않게
add(`<div class="abs" style="left:150px;top:900px;transform:rotate(-5deg)">${PACK(250)}</div>`);
add(`<div class="abs J" style="left:420px;top:960px;transform:rotate(4deg);background:#fff;border:7px solid ${K};border-radius:22px;padding:12px 26px 10px;font-size:88px;line-height:1.05;text-align:center;color:#E2483A;box-shadow:0 10px 0 rgba(62,47,37,.16)"><span style="font-size:32px;color:#7E6B5C">이렇게 된다고?</span><br>8500원</div>`);
add(`<div class="abs J" style="left:452px;top:1180px;transform:rotate(-5deg);background:#fff;border:6px solid ${K};border-radius:20px;padding:10px 24px 8px;font-size:46px;line-height:1.1;box-shadow:0 10px 0 rgba(62,47,37,.14)"><span style="font-size:28px;color:#7E6B5C">지금 </span>4500원</div>`);
add(`<div class="abs J" style="left:690px;top:880px;width:104px;height:104px;border-radius:50%;background:#E2483A;border:7px solid ${K};color:#fff;font-size:72px;display:flex;align-items:center;justify-content:center;transform:rotate(10deg);box-shadow:0 10px 0 rgba(62,47,37,.16)">?</div>`);
// 제목 — 흰 테두리 스티커 글씨(질문, 답 없음)
add(`<div class="abs title" style="left:92px;top:604px;font-size:128px;-webkit-text-stroke:16px #fff;paint-order:stroke fill;text-shadow:0 10px 0 rgba(62,47,37,.12)"><span class="hl">담뱃값 인상</span>,<br><span style="color:#E2483A">진짜 8500원?</span></div>`);
[[944,800,24],[80,880,22],[700,1290,16]].forEach(([x,y,r])=>add(`<svg class="abs" style="left:${x-r}px;top:${y-r}px" width="${2*r}" height="${2*r}" viewBox="-10 -10 20 20"><path d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#FFD45C" stroke="#4A3A33" stroke-width="1.4"/></svg>`));
dori(-20,1050,470,{tilt:-6,gx:.8,gy:-.3,armL:.6,armR:.9,earL:4,earR:4,surprise:.8,open:.5});
mori(716,1000,360,{lid:.42,browR:1,gx:-.9,gy:-.1,tilt:-3,tail:.7,armL:.85,smile:1});
if(G){
  add(`<div class="abs" style="left:0;top:0;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:0;top:1540px;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:960px;top:0;width:120px;height:1920px;background:rgba(226,72,58,.12)"></div><div class="abs" style="left:0;top:600px;width:1080px;height:720px;border-top:4px dashed #2E9C83;border-bottom:4px dashed #2E9C83"></div><div class="abs" style="left:0;top:285px;width:1080px;height:1350px;border-top:4px dotted #5B8CFF;border-bottom:4px dotted #5B8CFF"></div>`);
}
document.fonts.ready.then(()=>{setTimeout(()=>{window.__ready=true;},300);});
</script>
</body>
</html>
