<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도리 썸네일</title>
<link rel="stylesheet" href="jua/index.css">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.otf);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.otf);font-weight:900}
:root{--cream:#FFF6EC;--ink:#3E2F25;--mint:#2E9C83;--red:#E2483A;--yel:#FFD45C;--blue:#5B8CFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);font-family:P,sans-serif;color:var(--ink);word-break:keep-all}
.frame{position:relative;overflow:hidden;background:var(--cream)}
.abs{position:absolute}
.J{font-family:Jua;font-weight:400}
.blob{position:absolute;border-radius:50%}
.title{isolation:isolate;font-family:Jua;line-height:1.08;letter-spacing:-2px;color:var(--ink)}
.hl{position:relative;display:inline-block}
.hl:before{content:"";position:absolute;left:-10px;right:-10px;bottom:6%;height:34%;background:var(--yel);border-radius:14px;z-index:-1;transform:rotate(-1.5deg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gLens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FC"/><stop offset="1" stop-color="#A9C8E8"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7B57E"/><stop offset="1" stop-color="#C98C55"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E7A63"/><stop offset="1" stop-color="#355A48"/></linearGradient>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5B8CFF"/><stop offset=".55" stop-color="#8FB7FF"/><stop offset="1" stop-color="#E3F0FF"/></linearGradient>
  <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3E9DD"/></linearGradient>
  <radialGradient id="gSh2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5A3A28" stop-opacity=".32"/><stop offset="1" stop-color="#5A3A28" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="root"></div>
<script src="dori_outfits.js"></script>
<script src="dori.js"></script>
<script src="mori.js"></script>
<script>
const qs=new URLSearchParams(location.search), G=qs.get('guide')==='1';
const W=1080, H=1920, K='#4A3A33';
const base={t:1.2,blink:0,happy:0,squint:0,surprise:0,sad:0,open:0,gx:0,gy:0,pouch:0,armL:0,armR:0,earL:0,earR:0,hop:0,squash:0,breath:0,tilt:0};
const root=document.getElementById('root');
root.innerHTML=`<div class="frame" id="f" style="width:${W}px;height:${H}px"></div>`;
const f=document.getElementById('f');
const add=(html)=>{f.insertAdjacentHTML('beforeend',html);return f.lastElementChild;};
function blobs(list){list.forEach(([x,y,s,c])=>add(`<div class="blob" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:radial-gradient(circle,${c} 0%,${c}00 68%)"></div>`));}
function dori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);Dori.mount(d,{outfit:CFG.outfit||''});Dori.draw({...base,...st});return d;}
function mori(x,y,w,st){const d=add(`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*570/400}px"></div>`);const m=Mori.mount(d,{variant:'cream'});m.draw(st);return d;}

// ===== LIFE.09 파킹통장 매일 이자 — '동전 주차장' 장면: 벽에 주차 표지판 P·달력(칸마다 동전), 매대 위 주차 칸에 동전 더미가 줄지어 서 있고 가운데 통장 + "하루 ?원" 가격표. 도리(tax 옷)는 깜짝, 모리는 의심 =====
// 핵심 띠 y 600~1320 · x 90~960: 제목 + 통장·가격표 / 보조 y 380~1540: 표지판·도리·모리 / 그 밖은 벽·바닥. 답(몇 원인지)은 드러내지 않는다. 상품·은행 이름 없음.
const CFG={outfit:'tax'};   // index.html 의 OUTFIT 과 같게
document.querySelector('svg defs').insertAdjacentHTML('beforeend',`<linearGradient id="gBook" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FD0BA"/><stop offset="1" stop-color="#2E9C83"/></linearGradient><linearGradient id="gSign" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86A9FF"/><stop offset="1" stop-color="#3F6FE0"/></linearGradient><linearGradient id="gPole" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9CED8"/><stop offset="1" stop-color="#8E96A6"/></linearGradient><radialGradient id="gCoin" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".5" stop-color="#F4C64E"/><stop offset="1" stop-color="#C98F1E"/></radialGradient>`);
const STACK=(n,w)=>{let s='';for(let i=0;i<n;i++){const y=150-i*20;s+=`<ellipse cx="60" cy="${y+8}" rx="50" ry="14" fill="#C98F1E" stroke="${K}" stroke-width="5"/><ellipse cx="60" cy="${y}" rx="50" ry="14" fill="url(#gCoin)" stroke="${K}" stroke-width="5"/>`;}
  return `<svg viewBox="0 0 120 180" width="${w}" height="${w*1.5}" style="overflow:visible"><ellipse cx="60" cy="170" rx="58" ry="9" fill="url(#gSh2)"/>${s}<path d="M24 ${150-(n-1)*20-4} q14 -8 30 -9" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7" fill="none"/></svg>`;};
const BOOK=(w)=>`<svg viewBox="0 0 240 170" width="${w}" height="${w*170/240}" style="overflow:visible">
  <ellipse cx="120" cy="162" rx="112" ry="10" fill="url(#gSh2)"/>
  <path d="M30 34 L210 22 L214 142 L34 154 Z" fill="url(#gPaper)" stroke="${K}" stroke-width="5" stroke-linejoin="round"/>
  <path d="M22 30 L204 20 L208 140 L26 150 Z" fill="url(#gBook)" stroke="${K}" stroke-width="6" stroke-linejoin="round"/>
  <path d="M40 46 L190 38" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <rect x="62" y="70" width="104" height="44" rx="10" transform="rotate(-3 114 92)" fill="#FFF6E0" stroke="${K}" stroke-width="4"/>
  <text x="114" y="104" text-anchor="middle" transform="rotate(-3 114 92)" font-family="Jua" font-size="34" fill="#3E2F25">통장</text>
  <path d="M48 130 L186 122" stroke="#E9C45A" stroke-width="6" stroke-linecap="round"/>
</svg>`;
const PSIGN=(w)=>`<svg viewBox="0 0 120 260" width="${w}" height="${w*260/120}" style="overflow:visible">
  <rect x="52" y="96" width="16" height="164" rx="6" fill="url(#gPole)" stroke="${K}" stroke-width="5"/>
  <rect x="6" y="6" width="108" height="108" rx="20" fill="url(#gSign)" stroke="${K}" stroke-width="6"/>
  <rect x="16" y="16" width="88" height="88" rx="14" fill="none" stroke="#fff" stroke-width="4" opacity=".8"/>
  <text x="60" y="88" text-anchor="middle" font-family="Jua" font-size="78" fill="#fff">P</text>
  <path d="M22 30 q8 -10 22 -12" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6" fill="none"/>
</svg>`;
const CAL=(w)=>{let cells='';for(let r=0;r<4;r++)for(let c=0;c<7;c++){const x=14+c*16,y=46+r*16;
   cells+=`<rect x="${x}" y="${y}" width="14" height="14" rx="3" fill="#fff" stroke="#CDB9A6" stroke-width="1.5"/><circle cx="${x+7}" cy="${y+7}" r="4.6" fill="url(#gCoin)" stroke="#B57E14" stroke-width="1.2"/>`;}
  return `<svg viewBox="0 0 140 130" width="${w}" height="${w*130/140}" style="overflow:visible">
  <rect x="6" y="14" width="128" height="106" rx="14" fill="url(#gPaper)" stroke="${K}" stroke-width="5"/>
  <path d="M6 30 a14 14 0 0 1 14 -16 h100 a14 14 0 0 1 14 16 v8 h-128z" fill="#E8833A" stroke="${K}" stroke-width="5"/>
  <rect x="34" y="4" width="8" height="20" rx="4" fill="#fff" stroke="${K}" stroke-width="3"/><rect x="98" y="4" width="8" height="20" rx="4" fill="#fff" stroke="${K}" stroke-width="3"/>
  ${cells}</svg>`;};
f.style.background='linear-gradient(180deg,#F6EEDC 0%,#FFF6EC 45%,#FFF3E6 100%)';
add(`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;background-image:radial-gradient(rgba(74,58,51,.07) 2px,transparent 2.5px);background-size:46px 46px"></div>`);
blobs([[-260,560,800,'#FFE7D6'],[520,600,700,'#FFF0C8']]);
// 벽: 주차 표지판(왼쪽 위 보조 영역) · 동전 달력(오른쪽 위 보조 영역)
add(`<div class="abs" style="left:96px;top:392px;transform:rotate(-4deg)">${PSIGN(150)}</div>`);
add(`<div class="abs" style="left:728px;top:398px;transform:rotate(5deg)">${CAL(210)}</div>`);
// 매대(나무) + 주차 칸 흰 선
add(`<div class="abs" style="left:0;top:1330px;width:1080px;height:590px;background:
  repeating-linear-gradient(90deg,rgba(74,58,51,.10) 0 4px,transparent 4px 180px),
  linear-gradient(180deg,#E7B57E 0%,#C98E5C 100%);border-top:8px solid ${K}"></div>`);
add(`<div class="abs" style="left:96px;top:1252px;width:888px;height:26px;border-radius:8px;background:#C9A985;border:6px solid ${K};box-shadow:0 8px 0 rgba(62,47,37,.12)"></div>`);
add(`<svg class="abs" style="left:110px;top:1100px" width="860" height="150" viewBox="0 0 860 150">${[0,1,2,3,4,5].map(i=>`<path d="M${i*170+10} 150 L${i*170+40} 10" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".85"/>`).join('')}</svg>`);
// 주차 칸마다 동전 더미(가운데는 통장 자리)
[[170,5,116],[300,3,100],[880,4,110]].forEach(([x,n,w])=>add(`<div class="abs" style="left:${x-w/2}px;top:${1252-w*1.5+8}px">${STACK(n,w)}</div>`));
add(`<div class="abs" style="left:356px;top:1000px;transform:rotate(-3deg)">${BOOK(360)}</div>`);
// 가격표 "하루 ?원" + 딱지
add(`<div class="abs J" style="left:600px;top:1150px;transform:rotate(5deg);background:#fff;border:6px solid ${K};border-radius:20px;padding:10px 26px 8px;font-size:66px;line-height:1.05;text-align:center;color:#E8833A;box-shadow:0 10px 0 rgba(62,47,37,.14)"><span style="font-size:28px;color:#7E6B5C">천만 원 · 하루</span><br>?원</div>`);
add(`<div class="abs J" style="left:300px;top:900px;transform:rotate(-3deg);background:#FFD45C;border:6px solid ${K};border-radius:999px;padding:8px 30px;font-size:52px;color:#3E2F25;box-shadow:0 8px 0 rgba(62,47,37,.16);white-space:nowrap">복리로 쑥쑥?</div>`);
// 제목 — 흰 테두리 스티커 글씨(질문, 답 없음)
add(`<div class="abs title" style="left:92px;top:604px;font-size:124px;-webkit-text-stroke:16px #fff;paint-order:stroke fill;text-shadow:0 10px 0 rgba(62,47,37,.12)"><span class="hl">파킹통장 이자</span>,<br><span style="color:#E8833A">매일 받으면?</span></div>`);
[[944,820,24],[80,900,22],[560,1300,16]].forEach(([x,y,r])=>add(`<svg class="abs" style="left:${x-r}px;top:${y-r}px" width="${2*r}" height="${2*r}" viewBox="-10 -10 20 20"><path d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#FFD45C" stroke="#4A3A33" stroke-width="1.4"/></svg>`));
dori(-30,1110,440,{tilt:-6,gx:.8,gy:-.3,armL:.6,armR:.9,earL:4,earR:4,surprise:.8,open:.5});
mori(800,1060,300,{lid:.42,browR:1,gx:-.9,gy:-.1,tilt:-3,tail:.7,armL:0,smile:1});
if(G){
  add(`<div class="abs" style="left:0;top:0;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:0;top:1540px;width:1080px;height:380px;background:rgba(226,72,58,.18)"></div><div class="abs" style="left:960px;top:0;width:120px;height:1920px;background:rgba(226,72,58,.12)"></div><div class="abs" style="left:0;top:600px;width:1080px;height:720px;border-top:4px dashed #2E9C83;border-bottom:4px dashed #2E9C83"></div><div class="abs" style="left:0;top:285px;width:1080px;height:1350px;border-top:4px dotted #5B8CFF;border-bottom:4px dotted #5B8CFF"></div>`);
}
document.fonts.ready.then(()=>{setTimeout(()=>{window.__ready=true;},300);});
</script>
</body>
</html>
